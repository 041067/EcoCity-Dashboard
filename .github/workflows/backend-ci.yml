name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main, develop]
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    name: Lint, Tests e Migrations
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint (ruff)
        run: ruff check .

      - name: Import do app FastAPI
        run: python -c "from app.main import app; print('FastAPI importado com sucesso')"

      - name: Testes (pytest)
        run: pytest

      - name: Validar migrations (Alembic offline)
        run: |
          alembic upgrade head --sql > /dev/null
          echo "Migrations OK"

      - name: Validar migrations (Alembic online em SQLite)
        run: |
          DATABASE_URL=sqlite:///./ci_alembic.db alembic upgrade head
          DATABASE_URL=sqlite:///./ci_alembic.db alembic check
