name: Deploy Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: production
  cancel-in-progress: false

jobs:
  migrate:
    name: "1. Migrar banco (Supabase)"
    runs-on: ubuntu-latest
    environment: production
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Python 3.12
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/requirements*.txt

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Aplicar migrations (Alembic upgrade head)
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          [ -z "$DATABASE_URL" ] && { echo "Secret DATABASE_URL ausente no environment 'production'"; exit 1; }
          alembic upgrade head

  deploy-backend:
    name: "2. Deploy Backend (Render)"
    needs: migrate
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Disparar Deploy Hook do Render
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          [ -z "$RENDER_DEPLOY_HOOK_URL" ] && { echo "Secret RENDER_DEPLOY_HOOK_URL ausente"; exit 1; }
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

  deploy-frontend:
    name: "3. Deploy Frontend (Vercel)"
    needs: deploy-backend
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Disparar Deploy Hook da Vercel
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: |
          [ -z "$VERCEL_DEPLOY_HOOK_URL" ] && { echo "Secret VERCEL_DEPLOY_HOOK_URL ausente"; exit 1; }
          curl -fsS -X POST "$VERCEL_DEPLOY_HOOK_URL"
